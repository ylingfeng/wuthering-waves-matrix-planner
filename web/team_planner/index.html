<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="./"><link rel="icon" href="./favicon.ico" sizes="any"><link rel="apple-touch-icon" href="./favicon.png"><title>鸣潮 · 矩阵配队</title><link rel="stylesheet" href="./style.css"><script defer src="./vendor/solver.js"></script><script defer src="./solver-source.js"></script><script defer src="./seed.js"></script><script defer src="./local-planner.js"></script><script defer src="./app.js"></script><script defer src="./custom-select.js"></script></head>
<body>
<header><a class="brand" href="./index.html"><img src="./favicon.png" width="36" height="36" alt="达妮娅"><span>鸣潮 <b>矩阵配队</b></span></a><div class="header-actions"><span id="save-status" role="status">正在载入…</span><button id="show-guide" type="button">使用说明</button><details class="config-menu"><summary>配置管理<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary><div class="config-options"><button id="export-config">导出个人配置</button><button id="import-config">导入个人配置</button><button id="restore-config">恢复上次保存</button></div></details><input id="import-file" type="file" accept=".json,application/json" hidden><button id="save">立即保存</button></div></header>
<main>
<section class="intro"><div><h1>矩阵配队规划</h1><p class="muted">先最大化队伍数量，再比较得分。基础分 × 用户配队加权 × 三名角色加权。</p></div><div class="summary" id="summary"></div></section>
<div class="workspace-actions"><label class="planning-scope-label">计算范围 <select id="planning-scope" aria-label="配队范围"><option value="owned">仅已拥有角色</option><option value="all">全角色计算（含未拥有）</option></select></label><button class="primary" id="calculate">计算配队</button></div>
<nav aria-label="页面"><button data-tab="characters" class="active">角色库 <span id="character-count"></span></button><button data-tab="teams">候选队伍 <span id="team-count"></span></button><button data-tab="results">配队结果 <span id="result-count">—</span></button></nav>
<section id="characters" class="page">
<div class="toolbar"><div class="filters"><input id="character-search" type="search" placeholder="搜索角色名称…" aria-label="搜索角色"><select id="character-filter" aria-label="角色筛选"><option value="all">全部角色</option><option value="owned" selected>我的角色</option><option value="unowned">未拥有</option><option value="healer">奶妈</option><option value="weekly">本周已调整</option></select></div><span class="hint">本周体力为实际可用次数，可直接调整；填写 0 则本周不参与。</span></div>
<div id="character-grid" class="character-grid"></div>
</section>
<section id="teams" class="page" hidden>
<div class="toolbar"><div class="filters"><input id="team-search" type="search" placeholder="搜索成员，空格匹配多人，如：赞 夏" aria-label="搜索队伍"><select id="team-filter" aria-label="队伍筛选"><option value="available">现有角色可组成</option><option value="all">全部候选</option><option value="unowned">包含未拥有角色</option><option value="locked">必选队伍</option><option value="disabled">已停用</option></select></div><button id="new-team">新建队伍</button></div>
<p class="hint">同一队伍可以有多套输出轴。配队顺序可编辑，实际起手和槽位请参考轴说明。工坊与 Wiki 资料不代表你的账号已实测。</p>
<div id="evidence-filter" class="evidence-filter" aria-label="按证据来源筛选"></div>
<div id="team-grid" class="team-grid"></div>
</section>
<section id="results" class="page" hidden>
<div class="toolbar"><label class="check"><input id="include-inferred" type="checkbox"> 包含机制推导的替补组合（待验证）</label><label class="check"><input id="fill-roles" type="checkbox"> 剩余体力按主辅奶补队</label><label class="check"><input id="fill-solo" type="checkbox"> 丹瑾单人补队（剩余两位不限定位）</label><span class="hint">优先使用候选队伍，再按定位补充；结果按得分升序排列。</span></div>
<div id="result-body" class="empty"><strong>尚未生成配队方案</strong><p>设置角色与候选队伍后，点击上方「计算配队」。</p></div>
</section>
<footer>修改自动保存 · 导出个人配置用于备份或迁移</footer>
</main>
<dialog id="editor"><form id="team-form"><div class="dialog-heading"><div><h2 id="editor-title">编辑队伍</h2><button id="editor-guide" type="button" class="editor-guide">填写说明</button></div><button type="button" id="close-editor" aria-label="关闭">×</button></div>
<div id="member-inputs" class="member-inputs"></div><div id="rover-parking" hidden></div>
<label id="rover-row" hidden>漂泊者属性<select id="rover-attribute"><option value="">请选择属性</option><option>衍射</option><option>湮灭</option><option>气动</option><option>导电</option></select></label>
<p class="hint" id="team-weight"></p><p class="hint" id="source-audit-status"></p>
<label class="block">配队备注<textarea id="team-note" rows="2"></textarea></label>
<div class="axis-heading"><h3>输出轴</h3><button id="add-axis" type="button">＋ 添加一套轴</button></div>
<select id="axis-select" aria-label="选择输出轴"></select><div id="axis-fields"><label class="block">轴名称<input id="axis-name"></label><label class="block">轴说明 / 固定按键流程<textarea id="axis-description" rows="7"></textarea></label><a id="axis-source" target="_blank" rel="noopener">查看工坊代码</a></div><p id="axis-empty" class="hint">该队伍只有配队推荐，尚无输出轴。可以先规划，之后补轴。</p>
<div id="team-sources" class="sources"></div><p id="editor-error" role="alert"></p>
<div class="dialog-footer"><button id="delete-team" type="button" class="danger">删除此候选</button><button type="submit" class="primary">应用到候选列表</button></div>
</form></dialog>
<div id="onboarding" hidden>
<div class="tour-shade"></div><div class="tour-focus" aria-hidden="true"></div>
<section class="tour-panel" role="dialog" aria-modal="true" aria-labelledby="onboarding-title" tabindex="-1">
<div class="tour-heading"><span id="tour-progress"></span><button id="tour-skip" type="button">跳过</button></div>
<h2 id="onboarding-title"></h2><p id="tour-description"></p>
<div class="tour-dots" id="tour-dots" aria-hidden="true"></div>
<label class="check"><input id="hide-onboarding" type="checkbox">下次不再显示</label>
<div class="tour-actions"><button id="tour-prev" type="button">上一步</button><button id="tour-next" type="button" class="primary">下一步</button></div>
</section></div>
<div id="toast"  role="status" hidden></div>
</body></html>
